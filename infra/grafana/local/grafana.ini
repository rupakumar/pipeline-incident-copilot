; Local Grafana for the copilot's ticket desk. Started by `python -m scripts.local_grafana`, which sets the
; COPILOT_GRAFANA_* paths below (all runtime state stays in the git-ignored data/runtime/grafana/).
; Only these settings differ from Grafana's defaults.

[paths]
data = $__env{COPILOT_GRAFANA_DATA}
logs = $__env{COPILOT_GRAFANA_DATA}/logs
plugins = $__env{COPILOT_GRAFANA_DATA}/plugins
provisioning = $__env{COPILOT_GRAFANA_PROVISIONING}

[server]
; this Mac only, like the approval console (copilot serve, 127.0.0.1:8787)
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
; open the desk without logging in (view only); sign in as admin to edit
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = $__env{COPILOT_GRAFANA_DATA}/dashboards/incident_desk.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
